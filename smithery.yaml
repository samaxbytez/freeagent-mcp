startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - freeagentClientId
      - freeagentClientSecret
    properties:
      freeagentClientId:
        type: string
        description: Your FreeAgent OAuth2 client ID from the Developer Dashboard
      freeagentClientSecret:
        type: string
        description: Your FreeAgent OAuth2 client secret from the Developer Dashboard
      freeagentSandbox:
        type: string
        description: Set to "true" to use sandbox instead of production (defaults to production)
      freeagentAccessToken:
        type: string
        description: Legacy - direct OAuth2 access token (skips stored token flow)
      freeagentEnableSensitiveTools:
        type: string
        description: Set to "true" to enable user management, invoice emailing, adding bank accounts and changing contact emails (off by default)
      freeagentAttachmentsDir:
        type: string
        description: Directory attachment_path may read receipts from. Required to attach files to expenses and bills.
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', 'freeagent-mcp-server'],
      env: {
        FREEAGENT_CLIENT_ID: config.freeagentClientId,
        FREEAGENT_CLIENT_SECRET: config.freeagentClientSecret,
        ...(config.freeagentSandbox ? { FREEAGENT_SANDBOX: config.freeagentSandbox } : {}),
        ...(config.freeagentAccessToken ? { FREEAGENT_ACCESS_TOKEN: config.freeagentAccessToken } : {}),
        ...(config.freeagentEnableSensitiveTools ? { FREEAGENT_ENABLE_SENSITIVE_TOOLS: config.freeagentEnableSensitiveTools } : {}),
        ...(config.freeagentAttachmentsDir ? { FREEAGENT_ATTACHMENTS_DIR: config.freeagentAttachmentsDir } : {})
      }
    })
  exampleConfig:
    freeagentClientId: "your_client_id_here"
    freeagentClientSecret: "your_client_secret_here"
