# Weekly update PRs for npm dependencies and for the pinned GitHub Actions
# SHAs. Security fixes arrive as soon as an advisory is published once
# Dependabot security updates are switched on in the repo settings.
#
# cooldown: a routine version update is only proposed once the release is a
# week old. Malicious or broken releases are usually caught and pulled within
# days, so most never reach a PR. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The MCP SDK and zod are bundled into the published file, so an update
      # to them changes what users run. /release counts a bundled version change
      # as releasable (RELEASING.md step 3) whatever the commit prefix.
      bundled:
        patterns: ["@modelcontextprotocol/sdk", "zod"]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["@modelcontextprotocol/sdk", "zod"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    # Major upgrades of the toolchain are done deliberately, not weekly: they
    # tend to need each other (typescript-eslint only supports some TypeScript
    # majors) and @types/node follows the Node major in package.json engines.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
